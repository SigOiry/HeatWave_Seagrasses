project:
  type: manuscript
  output-dir: "../docs"
execute:
  freeze: auto
format:
  html: 
    toc: true
    theme: cosmo
    comments:
      hypothesis: true
  apaquarto-docx: 
    output-file: "Simon_Heatwaves_Paper"
    floatsintext: true
    numbered-lines: true
  apaquarto-pdf: 
    fig-pos: "H"
    output-file: "Simon_Heatwaves_Paper"
    floatsintext: true
    numbered-lines: true
    documentmode: doc
    nocorrespondence: true
render: 
  - "!*.qmd"
  - "!*.ipynb"
  - "!*.out.ipynb"
resources:
  - "!*.qmd"
  - "!*.ipynb"
  - "!*.out.ipynb"
  - "!*.embed.ipynb"

bibliography: library.bib